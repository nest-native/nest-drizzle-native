name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/drizzle

      - name: Typecheck package
        run: npm run typecheck --workspace @nest-native/drizzle

  package-test-node-22:
    name: Package tests/coverage (Node 22)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drizzle
          POSTGRES_PASSWORD: drizzle
          POSTGRES_USER: drizzle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drizzle -d drizzle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: drizzle
          MYSQL_PASSWORD: drizzle
          MYSQL_ROOT_PASSWORD: drizzle_root
          MYSQL_USER: drizzle
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdrizzle_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          NEST_DRIZZLE_NATIVE_MYSQL_URL: mysql://drizzle:drizzle@127.0.0.1:3306/drizzle
          NEST_DRIZZLE_NATIVE_POSTGRES_URL: postgresql://drizzle:drizzle@127.0.0.1:5432/drizzle
        run: npm run test:cov

  package-quality:
    name: Tests, coverage, and complexity (Node 22)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drizzle
          POSTGRES_PASSWORD: drizzle
          POSTGRES_USER: drizzle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drizzle -d drizzle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: drizzle
          MYSQL_PASSWORD: drizzle
          MYSQL_ROOT_PASSWORD: drizzle_root
          MYSQL_USER: drizzle
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdrizzle_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Restore base branch CI data
        if: github.event_name == 'pull_request'
        id: base-ci-data
        uses: actions/cache/restore@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.base_ref }}-
          restore-keys: ci-data-node-22-${{ github.base_ref }}-

      - name: Extract base CI data
        if: steps.base-ci-data.outputs.cache-matched-key
        run: |
          cp ci-data/coverage-summary.json base-coverage-summary.json 2>/dev/null || true
          cp ci-data/test-results.json base-test-results.json 2>/dev/null || true
          cp ci-data/test-step-duration-ms.txt base-test-step-duration-ms.txt 2>/dev/null || true
          cp ci-data/cognitive-complexity-summary.json base-cognitive-complexity-summary.json 2>/dev/null || true

      - name: Run tests with coverage
        env:
          NEST_DRIZZLE_NATIVE_MYSQL_URL: mysql://drizzle:drizzle@127.0.0.1:3306/drizzle
          NEST_DRIZZLE_NATIVE_POSTGRES_URL: postgresql://drizzle:drizzle@127.0.0.1:5432/drizzle
        run: |
          START=$SECONDS
          npm run test:cov
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

      - name: Generate cognitive complexity report
        run: npm run complexity:report

      - name: Generate base cognitive complexity fallback
        if: github.event_name == 'pull_request'
        run: |
          if [ -f base-cognitive-complexity-summary.json ]; then
            exit 0
          fi

          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_DIR/node_modules"
          (
            cd "$BASE_DIR"
            node scripts/collect-cognitive-complexity.mjs \
              --output "$GITHUB_WORKSPACE/base-cognitive-complexity-summary.json"
          )

      - name: Cache CI data for base branch
        if: github.event_name == 'push'
        run: |
          mkdir -p ci-data
          cp coverage/coverage-summary.json ci-data/coverage-summary.json
          cp test-results.json ci-data/test-results.json
          cp test-step-duration-ms.txt ci-data/test-step-duration-ms.txt
          cp complexity/cognitive-complexity-summary.json ci-data/cognitive-complexity-summary.json

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.ref_name }}-${{ github.sha }}

      - name: Get changed files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/**/*.ts' | tee changed-files.txt

      - name: Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/coverage-report.js');
            await report({ github, context, core });

      - name: Performance Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/performance-report.js');
            await report({ github, context, core });

      - name: Complexity Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/complexity-report.js');
            await report({ github, context, core });

      - name: Coverage and performance summary
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const duration = fs.readFileSync('test-step-duration-ms.txt', 'utf8').trim();
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const report = [
            '### Package Quality',
            '',
            '| Metric | Value |',
            '| :--- | ---: |',
            '| Statements | ' + metrics.statements + '% |',
            '| Branches | ' + metrics.branches + '% |',
            '| Functions | ' + metrics.functions + '% |',
            '| Lines | ' + metrics.lines + '% |',
            '| Test step duration | ' + duration + ' ms |',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-quality
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            complexity/cognitive-complexity-summary.json
            test-results.json
            test-step-duration-ms.txt
          if-no-files-found: error

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate package tarball
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit

  samples:
    name: Sample validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drizzle
          POSTGRES_PASSWORD: drizzle
          POSTGRES_USER: drizzle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drizzle -d drizzle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: drizzle
          MYSQL_PASSWORD: drizzle
          MYSQL_ROOT_PASSWORD: drizzle_root
          MYSQL_USER: drizzle
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdrizzle_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/drizzle

      - name: Run sample matrix
        env:
          NEST_DRIZZLE_NATIVE_MYSQL_URL: mysql://drizzle:drizzle@127.0.0.1:3306/drizzle
          NEST_DRIZZLE_NATIVE_POSTGRES_URL: postgresql://drizzle:drizzle@127.0.0.1:5432/drizzle
        run: |
          START=$SECONDS
          npm run ci:sample
          echo $(( (SECONDS - START) * 1000 )) > sample-validation-duration-ms.txt

      - name: Driver matrix summary
        run: |
          DURATION_MS="$(cat sample-validation-duration-ms.txt)"
          DURATION_SECONDS="$(node -e "console.log((Number(process.argv[1]) / 1000).toFixed(2))" "$DURATION_MS")"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Driver Sample Matrix

          | Metric | Value |
          | :--- | ---: |
          | Sample validation duration | DURATION_PLACEHOLDER |

          | Driver | Sample | CI behavior |
          | :--- | :--- | :--- |
          | libSQL | Multiple focused samples | Local file-backed round trips |
          | better-sqlite3 | `14-better-sqlite3-driver` | Local file-backed round trip |
          | PostgreSQL / `pg` | `15-postgres-driver` | Service-backed round trip |
          | MySQL / `mysql2` | `16-mysql-driver` | Service-backed round trip |

          PostgreSQL and MySQL credentials are generated by the workflow and are
          not printed in this summary.
          EOF
          sed -i "s/DURATION_PLACEHOLDER/${DURATION_SECONDS}s (${DURATION_MS}ms)/" "$GITHUB_STEP_SUMMARY"

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build

  drizzle-orm-v1-rc:
    name: drizzle-orm v1 RC compatibility (informational)
    runs-on: ubuntu-latest
    # Forward-looking, NON-BLOCKING probe for the next Drizzle major.
    # Since 0.4.0 the peer range admits the v1 RC line and this suite compiles
    # and passes against it (including the real CLS-adapter transaction spec),
    # so this job is EXPECTED GREEN. A failure means a newer RC regressed
    # compatibility -- revisit the support policy before v1 GA.
    # `continue-on-error` keeps a surprise RC from gating unrelated work.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies (stable base)
        run: npm ci

      - name: Overlay drizzle-orm@rc (v1 release candidate)
        # --legacy-peer-deps is still required: the workspace devDeps include
        # drizzle-zod, whose peer range excludes prereleases. (The CLS adapter
        # stopped needing it: 1.4.0 admits v1 — Papooch/nestjs-cls#604.)
        # --no-save keeps package.json/lock on the stable line.
        run: npm install --no-save --legacy-peer-deps drizzle-orm@rc

      - name: Record resolved drizzle-orm version
        run: |
          RESOLVED="$(node -e "const fs=require('node:fs');console.log(JSON.parse(fs.readFileSync('node_modules/drizzle-orm/package.json','utf8')).version)")"
          echo "drizzle-orm resolved to ${RESOLVED}"
          {
            echo "### drizzle-orm v1 RC compatibility probe"
            echo ""
            echo "Testing \`@nest-native/drizzle\` against \`drizzle-orm@${RESOLVED}\`."
            echo ""
            echo "Informational and non-blocking. Expected GREEN since 0.4.0 declared"
            echo "core v1 RC support -- a failure means a newer RC regressed compatibility."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run package tests against drizzle-orm v1 RC
        run: npm run test

  nestjs-latest-major:
    name: NestJS 12 compatibility (Node 22)
    runs-on: ubuntu-latest
    # The published peer range admits @nestjs/* ^11 || ^12, but the
    # devDependencies and the lockfile every other job installs stay on 11.x so
    # the default suite keeps testing the older end. This leg installs 12 on top
    # of that lockfile with --no-save and re-runs the package suite (gated
    # driver specs included), the build, and the sample matrix, which makes the
    # 12 end of the range a tested claim rather than an assumption.
    # --workspaces matters: the samples pin @nestjs/* to an exact 11.x, and a
    # root-only install would leave them a nested 11 while the root moved to 12.
    # The nestjs-cls line rides along because 6.2.x peer-pins @nestjs/* to
    # `< 12`; 6.3.0 / transactional 3.3.0 / adapter 1.5.0 admit 12 and sit
    # inside the declared caret ranges, so that part is a within-range overlay,
    # not a second major.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drizzle
          POSTGRES_PASSWORD: drizzle
          POSTGRES_USER: drizzle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drizzle -d drizzle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: drizzle
          MYSQL_PASSWORD: drizzle
          MYSQL_ROOT_PASSWORD: drizzle_root
          MYSQL_USER: drizzle
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdrizzle_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS 12 (this job only, never saved)
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            @nestjs/common@^12.0.0 \
            @nestjs/core@^12.0.0 \
            @nestjs/platform-express@^12.0.0 \
            @nestjs/swagger@^12.0.0 \
            @nestjs/testing@^12.0.0 \
            nestjs-cls@^6.3.0 \
            @nestjs-cls/transactional@^3.3.0 \
            @nestjs-cls/transactional-adapter-drizzle-orm@^1.5.0

      - name: Prove the package and every sample resolve NestJS 12
        # NestJS 12 does not export ./package.json, so the version is read next
        # to the resolved entry point, from inside each workspace directory.
        run: |
          for dir in packages/drizzle sample/*/; do
            (
              cd "$dir" && node -e "
                const path = require('node:path');
                const root = path.dirname(require.resolve('@nestjs/core'));
                const { version } = require(path.join(root, 'package.json'));
                console.log(process.cwd(), '@nestjs/core', version, '<-', root);
                if (!version.startsWith('12.')) process.exit(1);
              "
            )
          done

      - name: Typecheck and build the package against NestJS 12
        run: |
          npm run typecheck --workspace @nest-native/drizzle
          npm run build --workspace @nest-native/drizzle

      - name: Run the package suite against NestJS 12
        env:
          NEST_DRIZZLE_NATIVE_MYSQL_URL: mysql://drizzle:drizzle@127.0.0.1:3306/drizzle
          NEST_DRIZZLE_NATIVE_POSTGRES_URL: postgresql://drizzle:drizzle@127.0.0.1:5432/drizzle
        run: npm test

      - name: Run the sample matrix against NestJS 12
        env:
          NEST_DRIZZLE_NATIVE_MYSQL_URL: mysql://drizzle:drizzle@127.0.0.1:3306/drizzle
          NEST_DRIZZLE_NATIVE_POSTGRES_URL: postgresql://drizzle:drizzle@127.0.0.1:5432/drizzle
        run: npm run ci:sample
